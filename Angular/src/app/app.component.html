<dx-tag-box
  id="tag-box"
  [dataSource]="dataSource"
  valueExpr="ID"
  displayExpr="Name"
  [searchEnabled]="true"
  [showSelectionControls]="true"
  [grouped]="true"
  [multiline]="true"
  [maxDisplayedTags]="6"
  label="Products"
  labelMode="floating"
  (onValueChanged)="onValueChanged($event)"
  [dropDownOptions]="dropDownOptions"
>
</dx-tag-box>
